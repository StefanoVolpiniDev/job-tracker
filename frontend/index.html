<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker - Organizador de Carreiras</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #1e293b; color: white; }
        .btn-delete { background-color: #ef4444; padding: 5px 10px; }
        .btn-delete:hover { background-color: #dc2626; }
        .section { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Job Tracker Acadêmico</h1>
        <p>Gerencie suas candidaturas de emprego de forma simples e integrada.</p>

        <!-- Seção de Cadastro de Vaga -->
        <div class="section">
            <h2>Adicionar Nova Vaga</h2>
            <form id="jobForm">
                <div class="form-group">
                    <label>Cargo / Título:</label>
                    <input type="text" id="title" required placeholder="Ex: Desenvolvedor Júnior">
                </div>
                <div class="form-group">
                    <label>Empresa:</label>
                    <input type="text" id="company" required placeholder="Ex: Tech Corp">
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="status">
                        <option value="Candidatura Enviada">Candidatura Enviada</option>
                        <option value="Em Entrevista">Em Entrevista</option>
                        <option value="Proposta Recebida">Proposta Recebida</option>
                        <option value="Rejeitado">Rejeitado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Link da Vaga:</label>
                    <input type="text" id="link" placeholder="https://...">
                </div>
                <button type="submit">Salvar Vaga</button>
            </form>
        </div>

        <!-- Seção de Listagem de Vagas -->
        <div class="section">
            <h2>Minhas Candidaturas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Cargo</th>
                        <th>Empresa</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="jobTableBody">
                    <!-- Os dados entram aqui via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/jobs';

        // Função para carregar as vagas do Back-end
        async function loadJobs() {
            try {
                const response = await fetch(API_URL);
                const jobs = await response.json();
                const tbody = document.getElementById('jobTableBody');
                tbody.innerHTML = '';

                jobs.forEach(job => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${job.title}</td>
                        <td>${job.company}</td>
                        <td>${job.status}</td>
                        <td><button class="btn-delete" onclick="deleteJob(${job.id})">Excluir</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Erro ao carregar vagas:', error);
            }
        }

        // Função para cadastrar nova vaga
        document.getElementById('jobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const company = document.getElementById('company').value;
            const status = document.getElementById('status').value;
            const link = document.getElementById('link').value;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, company, status, link })
                });
                document.getElementById('jobForm').reset();
                loadJobs();
            } catch (error) {
                console.error('Erro ao salvar vaga:', error);
            }
        });

        // Função para deletar vaga
        async function deleteJob(id) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                loadJobs();
            } catch (error) {
                console.error('Erro ao deletar vaga:', error);
            }
        }

        // Carregar as vagas ao abrir a página
        loadJobs();
    </script>
</body>
</html>
